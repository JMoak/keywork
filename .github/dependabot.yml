version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:15"
      timezone: America/New_York
    open-pull-requests-limit: 8
    cooldown:
      default-days: 3
      semver-patch-days: 3
      semver-minor-days: 7
      semver-major-days: 14
    commit-message:
      prefix: chore(deps)
    groups:
      runtime:
        patterns:
          - "@jmoak/*"
          - "@opentui/*"
          - zod
        update-types: [minor, patch]
      development:
        patterns:
          - "@biomejs/*"
          - "@types/*"
          - "@vitest/*"
          - typescript
          - vitest
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:45"
      timezone: America/New_York
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
    commit-message:
      prefix: chore(ci)
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ["*"]
