name: ci

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check:pins
      - run: bun run check:guardrails
      - run: bun run check:prose
      - run: bun run check:contract HEAD^
      - run: bun run check:types
      - run: bun run lint
      - run: bun run test
      - name: commit e2e scenario pack against the committed goldens
        if: runner.os == 'Linux'
        run: bun run e2e --exclude long-session
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() && runner.os == 'Linux'
        with:
          name: e2e-artifacts
          path: artifacts/e2e
          if-no-files-found: ignore
