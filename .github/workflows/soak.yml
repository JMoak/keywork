name: soak

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      turns:
        description: conversation turns to drive through the panes
        default: "500"
        required: false

permissions:
  contents: read

jobs:
  endurance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: drive the panes for ${{ inputs.turns || 500 }} turns on the mock provider
        env:
          TURNS: ${{ inputs.turns || 500 }}
        run: bun scripts/soak.ts --turns "$TURNS" --out artifacts/soak
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: soak-report
          path: artifacts/soak
          if-no-files-found: warn
