name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, target: linux-x64 }
          - { runner: ubuntu-24.04-arm, target: linux-arm64 }
          - { runner: windows-latest, target: windows-x64 }
          - { runner: macos-latest, target: darwin-arm64 }
          - { runner: macos-15-intel, target: darwin-x64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: build and smoke the ${{ matrix.target }} binary on its own platform
        shell: bash
        run: |
          expect=""
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then expect="--expect-tag $GITHUB_REF_NAME"; fi
          bun scripts/release/build.ts --outdir dist/release $expect
      - name: doctor from the binary
        shell: bash
        run: |
          bin=$(ls dist/release/keywork-* | grep -v '\.sha256$')
          "$bin" doctor < /dev/null
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: keywork-${{ matrix.target }}
          path: dist/release/*
          if-no-files-found: error

  npm-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun scripts/release/build-npm.ts --outdir dist/npm
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: keywork-npm
          path: dist/npm
          if-no-files-found: error

  publish:
    needs: [binaries, npm-package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: keywork-*
          path: dist/artifacts
      - name: gather binaries and verify every checksum
        run: |
          mkdir -p dist/release
          find dist/artifacts -maxdepth 2 -type f -name 'keywork-*' -exec cp {} dist/release/ \;
          cd dist/release
          for sum in *.sha256; do sha256sum -c "$sum"; done
          cat *.sha256 > SHA256SUMS
          ls -la
      - name: create the GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
            --title "keywork $GITHUB_REF_NAME" \
            dist/release/keywork-* dist/release/SHA256SUMS
      - name: time the install rail against the published release
        if: github.ref_type == 'tag'
        env:
          KEYWORK_VERSION: ${{ github.ref_name }}
          KEYWORK_INSTALL_DIR: ${{ runner.temp }}/keywork-bin
        run: |
          start=$(date +%s)
          sh scripts/install.sh
          "$KEYWORK_INSTALL_DIR/keywork" --version
          end=$(date +%s)
          echo "install → --version took $((end - start))s on a clean runner (budget: 60s to first undo)"

  npm-publish:
    needs: [publish]
    if: github.ref_type == 'tag' && vars.NPM_PUBLISH == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: keywork-npm
          path: dist/npm
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: cd dist/npm && npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
