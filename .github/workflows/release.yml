name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - id: plan
        run: bun scripts/release/plan.ts
        env:
          GH_TOKEN: ${{ github.token }}
          NPM_PUBLISH: ${{ vars.NPM_PUBLISH }}

  check:
    uses: ./.github/workflows/ci.yml

  binaries:
    timeout-minutes: 30
    needs: [plan, check]
    if: needs.plan.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, target: linux-x64 }
          - { runner: ubuntu-24.04-arm, target: linux-arm64 }
          - { runner: windows-latest, target: windows-x64 }
          - { runner: macos-latest, target: darwin-arm64 }
          - { runner: macos-15-intel, target: darwin-x64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: build and smoke the ${{ matrix.target }} binary on its own platform
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: |
          bun scripts/release/build.ts --outdir dist/release \
            --version "$RELEASE_VERSION" --expect-tag "$RELEASE_TAG"
      - name: doctor from the binary
        shell: bash
        run: |
          bin=$(ls dist/release/keywork-* | grep -v '\.sha256$')
          "$bin" doctor < /dev/null
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: keywork-${{ matrix.target }}
          path: dist/release/*
          if-no-files-found: error
          overwrite: true

  npm-package:
    timeout-minutes: 15
    needs: [plan, check]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun scripts/release/build-npm.ts --outdir dist/npm --version "$RELEASE_VERSION"
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: keywork-npm
          path: dist/npm
          if-no-files-found: error
          overwrite: true

  publish:
    timeout-minutes: 20
    needs: [plan, binaries, npm-package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_VERSION: ${{ needs.plan.outputs.version }}
      RELEASE_TAG: ${{ needs.plan.outputs.tag }}
      RELEASE_SHA: ${{ needs.plan.outputs.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: keywork-*
          path: dist/artifacts
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: vars.NPM_PUBLISH == 'true'
        with:
          node-version: 24
      - run: npm install -g npm@12.2.2 && npm --version
        if: vars.NPM_PUBLISH == 'true'
      - name: gather binaries and verify every checksum
        run: |
          mkdir -p dist/release
          find dist/artifacts -maxdepth 2 -type f -name 'keywork-*' -exec cp {} dist/release/ \;
          cd dist/release
          for sum in *.sha256; do sha256sum -c "$sum"; done
          cat *.sha256 > SHA256SUMS
          ls -la
      - name: prepare the release tag and draft assets
        run: bun scripts/release/github-release.ts prepare
      - name: publish npm or verify an earlier successful publication
        if: vars.NPM_PUBLISH == 'true'
        run: |
          cp -R dist/artifacts/keywork-npm dist/npm
          bun scripts/release/publish-npm.ts
      - name: publish the completed GitHub release
        run: bun scripts/release/github-release.ts complete
      - name: time the install rail against the published release
        env:
          KEYWORK_VERSION: ${{ needs.plan.outputs.tag }}
          KEYWORK_INSTALL_DIR: ${{ runner.temp }}/keywork-bin
        run: |
          start=$(date +%s)
          sh scripts/install.sh
          "$KEYWORK_INSTALL_DIR/keywork" --version
          end=$(date +%s)
          echo "install → --version took $((end - start))s on a clean runner (budget: 60s to first undo)"
